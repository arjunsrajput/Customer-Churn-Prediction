<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Churn Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f5f7fb;
}
.card{
border:none;
border-radius:16px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
}
.section-title{
font-weight:700;
color:#0d6efd;
margin-bottom:15px;
}
.result-box{
background:#eef6ff;
border-left:6px solid #0d6efd;
padding:18px;
border-radius:10px;
}
label{
font-weight:600;
}
small{
color:#6c757d;
}
</style>
</head>

<body>

<div class="container py-5">

<div class="text-center mb-4">
<h1 class="fw-bold text-primary">Customer Churn Prediction</h1>
<p class="text-muted">
Predict whether a telecom customer is likely to churn using Machine Learning.
</p>
</div>

<form action="/" method="POST">

<div class="card p-4 mb-4">

<h4 class="section-title">Customer Information</h4>

<div class="row g-3">

<div class="col-md-6">
<label>Gender</label>
<select class="form-select" name="query4">
<option value="Male" {% if query4=="Male" %}selected{% endif %}>Male</option>
<option value="Female" {% if query4=="Female" %}selected{% endif %}>Female</option>
</select>
</div>

<div class="col-md-6">
<label>Senior Citizen</label>
<select class="form-select" name="query1">
<option value="0">No</option>
<option value="1">Yes</option>
</select>
<small>0 = No, 1 = Yes</small>
</div>

<div class="col-md-6">
<label>Partner</label>
<select class="form-select" name="query5">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-6">
<label>Dependents</label>
<select class="form-select" name="query6">
<option>Yes</option>
<option>No</option>
</select>
</div>

</div>

</div>

<div class="card p-4 mb-4">

<h4 class="section-title">Phone & Internet Services</h4>

<div class="row g-3">

<div class="col-md-6">
<label>Phone Service</label>
<select class="form-select" name="query7">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-6">
<label>Multiple Lines</label>
<select class="form-select" name="query8">
<option>Yes</option>
<option>No</option>
<option>No phone service</option>
</select>
</div>

<div class="col-md-6">
<label>Internet Service</label>
<select class="form-select" name="query9">
<option>DSL</option>
<option>Fiber optic</option>
<option>No</option>
</select>
</div>

<div class="col-md-6">
<label>Online Security</label>
<select class="form-select" name="query10">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="col-md-6">
<label>Online Backup</label>
<select class="form-select" name="query11">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="col-md-6">
<label>Device Protection</label>
<select class="form-select" name="query12">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="col-md-6">
<label>Tech Support</label>
<select class="form-select" name="query13">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="col-md-6">
<label>Streaming TV</label>
<select class="form-select" name="query14">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="col-md-6">
<label>Streaming Movies</label>
<select class="form-select" name="query15">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

</div>

</div>

<div class="card p-4 mb-4">

<h4 class="section-title">Billing Details</h4>

<div class="row g-3">

<div class="col-md-4">
<label>Contract</label>
<select class="form-select" name="query16">
<option>Month-to-month</option>
<option>One year</option>
<option>Two year</option>
</select>
</div>

<div class="col-md-4">
<label>Paperless Billing</label>
<select class="form-select" name="query17">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="col-md-4">
<label>Payment Method</label>
<select class="form-select" name="query18">
<option>Electronic check</option>
<option>Mailed check</option>
<option>Bank transfer (automatic)</option>
<option>Credit card (automatic)</option>
</select>
</div>

<div class="col-md-4">
<label>Tenure (Months)</label>
<input type="number" class="form-control" name="query19" placeholder="e.g. 24" value="{{query19}}" min="0">
</div>

<div class="col-md-4">
<label>Monthly Charges</label>
<input type="number" step="0.01" class="form-control" name="query2" placeholder="e.g. 79.85" value="{{query2}}">
</div>

<div class="col-md-4">
<label>Total Charges</label>
<input type="number" step="0.01" class="form-control" name="query3" placeholder="e.g. 1975.50" value="{{query3}}">
</div>

</div>

</div>

<div class="text-center mb-4">
<button class="btn btn-primary btn-lg px-5" type="submit">
Predict Churn
</button>
</div>

</form>

{% if output1 or output2 %}
<div class="card p-4">
<h4 class="section-title">Prediction Result</h4>

<div class="result-box">
<h5>{{output1}}</h5>
<p class="mb-0">{{output2}}</p>
</div>

</div>
{% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
